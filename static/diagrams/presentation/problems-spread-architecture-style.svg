<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif" role="img">
<title>Code audit findings by layer, split into critical and improvement counts</title>
<desc>System architecture diagram (mobile app, mobile backend, central database, web backend, web researcher platform) where each component shows two separate counts: findings that are critical and must be fixed first, and findings that can be improved alongside normal work. Transparent background.</desc>
<defs>
<marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="20" width="1200" height="700" rx="24" fill="none" stroke="#B4B2A9" stroke-width="1.25" stroke-dasharray="6 5"/>
<text x="70" y="58" font-size="16" font-weight="700" fill="#2C2C2A">Code audit findings by layer — split by severity, not summed</text>

<!-- Arrows -->
<line x1="315" y1="240" x2="315" y2="306" stroke="#73726c" stroke-width="1.5" marker-end="url(#arr2)"/>
<line x1="965" y1="240" x2="965" y2="306" stroke="#73726c" stroke-width="1.5" marker-end="url(#arr2)"/>
<path d="M460 450 C 470 485, 520 495, 555 516" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arr2)"/>
<path d="M820 450 C 810 485, 765 495, 726 516" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arr2)"/>

<!-- Mobile application -->
<rect x="100" y="100" width="430" height="140" rx="14" fill="#EFE0C8" stroke="#7b4b2a" stroke-width="1.5"/>
<text x="130" y="134" font-size="20" font-weight="700" fill="#2C2C2A">Mobile application</text>
<text x="130" y="158" font-size="13.5" fill="#5F5E5A">Flutter (Dart)</text>
<text x="130" y="178" font-size="13.5" fill="#5F5E5A">Farmers · processors · hubs</text>
<text x="130" y="212" font-size="14.5"><tspan font-weight="700" fill="#A32D2D">2 critical</tspan><tspan fill="#8A8578"> · </tspan><tspan font-weight="700" fill="#3B6D11">4 to improve</tspan></text>

<!-- Web researcher platform -->
<rect x="750" y="100" width="430" height="140" rx="14" fill="#EFE0C8" stroke="#7b4b2a" stroke-width="1.5"/>
<text x="780" y="134" font-size="20" font-weight="700" fill="#2C2C2A">Web researcher platform</text>
<text x="780" y="158" font-size="13.5" fill="#5F5E5A">Next.js 16 (TypeScript)</text>
<text x="780" y="178" font-size="13.5" fill="#5F5E5A">Researchers · admins</text>
<text x="780" y="212" font-size="14.5"><tspan font-weight="700" fill="#A32D2D">1 critical</tspan><tspan fill="#8A8578"> · </tspan><tspan font-weight="700" fill="#3B6D11">8 to improve</tspan></text>

<!-- Mobile backend -->
<rect x="100" y="310" width="430" height="140" rx="14" fill="#F4F1EA" stroke="#8A8578" stroke-width="1.25"/>
<text x="130" y="344" font-size="20" font-weight="700" fill="#2C2C2A">Mobile backend</text>
<text x="130" y="368" font-size="13.5" fill="#5F5E5A">Go · Gin / GORM</text>
<text x="130" y="388" font-size="13.5" fill="#5F5E5A">Auth · validation · business logic</text>
<text x="130" y="422" font-size="14.5"><tspan font-weight="700" fill="#A32D2D">1 critical</tspan><tspan fill="#8A8578"> · </tspan><tspan font-weight="700" fill="#3B6D11">6 to improve</tspan></text>

<!-- Web backend -->
<rect x="750" y="310" width="430" height="140" rx="14" fill="#F4F1EA" stroke="#8A8578" stroke-width="1.25"/>
<text x="780" y="344" font-size="20" font-weight="700" fill="#2C2C2A">Web backend</text>
<text x="780" y="368" font-size="13.5" fill="#5F5E5A">Kotlin + Spring Boot · jOOQ</text>
<text x="780" y="388" font-size="13.5" fill="#5F5E5A">Query abstraction · exports</text>
<text x="780" y="422" font-size="14.5"><tspan font-weight="700" fill="#A32D2D">3 critical</tspan><tspan fill="#8A8578"> · </tspan><tspan font-weight="700" fill="#3B6D11">7 to improve</tspan></text>

<!-- Central database -->
<rect x="425" y="520" width="430" height="150" rx="14" fill="#EFE0C8" stroke="#7b4b2a" stroke-width="1.5"/>
