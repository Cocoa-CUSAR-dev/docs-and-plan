<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cocoa Databank System Architecture</title>
<desc>Modular monolithic architecture with mobile app, web researcher platform, two backend servers, and a shared PostgreSQL database, deployed on AWS.</desc>
<style>
  .box { fill: #f4f3f1; stroke: #ccc; stroke-width: 1.5; }
  .box-accent { fill: #e8e2d8; stroke: #b08d57; stroke-width: 1.5; }
  .box-db { fill: #ddd3c2; stroke: #96784a; stroke-width: 1.5; }
  .title { font-family: sans-serif; font-size: 15px; font-weight: 600; fill: #222; }
  .sub { font-family: sans-serif; font-size: 11.5px; fill: #555; }
  .label { font-family: sans-serif; font-size: 11px; fill: #777; }
  .arrow { stroke: #888; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .group-label { font-family: sans-serif; font-size: 12px; font-weight: 600; fill: #666; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
  </marker>
</defs>

<rect width="900" height="620" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="580" rx="14" fill="none" stroke="#ddd" stroke-dasharray="4 3"/>
<text x="40" y="42" class="group-label">AWS infrastructure — 3 VM instances, stateless services auto-scale, DB replicated</text>

<rect x="60" y="70" width="230" height="80" rx="10" class="box-accent"/>
<text x="80" y="98" class="title">Mobile Application</text>
<text x="80" y="116" class="sub">Flutter (Dart)</text>
<text x="80" y="132" class="label">Farmers · Processors · Hubs</text>

<rect x="600" y="70" width="240" height="80" rx="10" class="box-accent"/>
<text x="620" y="98" class="title">Web Researcher Platform</text>
<text x="620" y="116" class="sub">Next.js (TypeScript)</text>
<text x="620" y="132" class="label">Researchers · Admins</text>

<rect x="60" y="230" width="230" height="90" rx="10" class="box"/>
<text x="80" y="258" class="title">Mobile Backend</text>
<text x="80" y="276" class="sub">Go (Golang)</text>
<text x="80" y="292" class="label">Auth · validation · business logic</text>

<rect x="600" y="230" width="240" height="90" rx="10" class="box"/>
<text x="620" y="258" class="title">Web Backend</text>
<text x="620" y="276" class="sub">Kotlin + Spring Boot</text>
<text x="620" y="292" class="label">Query abstraction · exports</text>

<rect x="300" y="410" width="300" height="100" rx="10" class="box-db"/>
<text x="330" y="443" class="title">Central Database</text>
<text x="330" y="461" class="sub">PostgreSQL (async replication)</text>
<text x="330" y="478" class="label">Farm → Plot → Tree → Batch history</text>

<path class="arrow" d="M175,150 L175,230"/>
<path class="arrow" d="M720,150 L720,230"/>
<path class="arrow" d="M230,290 C260,340 350,380 400,410"/>
<path class="arrow" d="M660,290 C620,340 540,380 500,410"/>

<text x="600" y="560" class="label">All inter-service traffic encrypted over HTTPS/TLS (no private subnet)</text>
</svg>
